[build-system]
requires = [
    "setuptools==83.0.0",
    "wheel==0.47.0",
    "packaging==26.2",
    "ninja==1.13.0",
    "torch==2.7.1",
]
build-backend = "setuptools.build_meta"

[project]
name = "community-kv"
version = "0.1.0"
description = "End-to-end fused-prefill and optimized-decode CommunityKV"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "torch==2.7.1",
    "transformers>=4.57",
    "triton>=3.2",
]

[project.scripts]
community-kv-eval = "evals.cli.main:main"
community-kv-eval-launch = "evals.cli.launch:main"
community-kv-tune-resolutions = "evals.cli.tune_resolutions:main"

[project.optional-dependencies]
eval = [
    "datasets>=3",
]
dev = [
    "datasets>=3",
    "numpy>=1.24",
    "pytest>=8",
]

[tool.setuptools]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
